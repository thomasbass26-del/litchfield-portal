<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Litchfield Portal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f6f6f3; --panel:#ffffff; --line:#e4e2dc; --line-strong:#cfcbc2; --ink:#161716; --ink-2:#4a4d49; --mute:#7c807a;
  --green:#1f4d3f; --green-ink:#143327; --green-tint:#e6efea;
  --amber:#7a5a12; --amber-tint:#f5eddc; --clay:#8a4532; --clay-tint:#f4e5df; --blue:#2c4866; --blue-tint:#e5ebf2;
  --r:4px;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"Inter","Segoe UI",Helvetica,Arial,sans-serif;font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--green)}
h1,h2,h3{margin:0;font-family:"Cormorant Garamond",Georgia,serif;font-weight:600;letter-spacing:0;line-height:1.15}
h1{font-size:40px}
h2{font-size:30px}
h3{font-size:22px}
p{margin:0}
.app{display:grid;grid-template-columns:232px 1fr;min-height:100vh}
.rail{background:#121a16;color:#d7ddd9;padding:28px 18px;display:flex;flex-direction:column;gap:2px;position:sticky;top:0;height:100vh}
.brand{padding:0 10px 22px;margin-bottom:12px;border-bottom:1px solid rgba(255,255,255,.1)}
.brand .co{font-family:"Cormorant Garamond",Georgia,serif;font-weight:600;font-size:21px;color:#fff;line-height:1.2}
.brand .sub{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:#9aa59f;margin-top:8px;line-height:1.5}
.rail button{background:none;border:0;color:inherit;text-align:left;padding:9px 10px;border-radius:var(--r);font-size:15px;cursor:pointer;display:flex;justify-content:space-between;align-items:center}
.rail button:hover{background:rgba(255,255,255,.06);color:#fff}
.rail button.on{background:rgba(255,255,255,.1);color:#fff;font-weight:500}
.rail button .n{font-size:12px;color:#b9c3bd;min-width:20px;text-align:right}
.rail .spacer{flex:1}
.rail .who{font-size:12.5px;color:#8f9993;padding:0 10px 4px}
.main{padding:0 48px 72px;max-width:1280px}
.top{display:flex;justify-content:space-between;align-items:center;padding:20px 0;border-bottom:1px solid var(--line);margin-bottom:34px;gap:16px;flex-wrap:wrap}
.viewas{display:flex;align-items:center;gap:12px;font-size:13.5px;color:var(--mute)}
.seg{display:inline-flex;border:1px solid var(--line-strong);border-radius:var(--r);overflow:hidden;background:var(--panel)}
.seg button{border:0;background:none;padding:5px 14px;cursor:pointer;font-size:13.5px;color:var(--ink-2)}
.seg button.on{background:var(--ink);color:#fff}
.badge{font-size:12.5px;color:var(--mute)}
.pagehead{display:flex;justify-content:space-between;align-items:center;gap:24px;margin-bottom:26px;flex-wrap:wrap}
.pagehead p{color:var(--ink-2);max-width:60ch;margin-top:8px;font-size:15px}
.btn{background:var(--green);color:#fff;border:1px solid var(--green);border-radius:var(--r);padding:9px 16px;cursor:pointer;font-weight:500;font-size:14px}
.btn:hover{background:var(--green-ink)}
.btn.quiet{background:var(--panel);color:var(--ink);border:1px solid var(--line-strong);font-weight:500}
.btn.quiet:hover{background:#f1f0eb}
.btn.small{padding:6px 12px;font-size:13.5px}
.grid{display:grid;gap:22px}
.grid.c3{grid-template-columns:repeat(3,1fr)}
.grid.c2{grid-template-columns:repeat(2,1fr)}
.grid.c4{grid-template-columns:repeat(4,1fr);gap:0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.stat{padding:18px 20px 18px 0;border-right:1px solid var(--line);margin-right:20px}
.stat:last-child{border-right:0;margin-right:0}
.stat .k{font-size:32px;font-weight:500;line-height:1;letter-spacing:-.02em}
.stat .l{color:var(--mute);font-size:13.5px;margin-top:6px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:20px 22px}
.panel h3{margin-bottom:12px;padding-bottom:10px;border-bottom:1px solid var(--line)}
h1 .chip,h2 .chip,h3 .chip,h3 .small,h3 .muted{font-family:"Inter","Segoe UI",Helvetica,Arial,sans-serif;font-weight:400;font-size:12.5px;vertical-align:middle;margin-left:8px}
table{width:100%;border-collapse:collapse;font-size:14.5px}
th{text-align:left;font-weight:500;color:var(--mute);font-size:12.5px;padding:10px 12px;border-bottom:1px solid var(--line)}
td{padding:13px 12px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
tr.row{cursor:pointer}
tr.row:hover td{background:#faf9f6}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:500;white-space:nowrap;color:var(--ink-2)}
.chip::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--line-strong)}
.chip.doing::before{background:#c9961e}
.chip.waiting::before{background:#b9674f}
.chip.done::before{background:var(--green)}
.chip.new::before{background:var(--blue)}
.muted{color:var(--mute)}
.small{font-size:13px}
.split{display:grid;grid-template-columns:340px 1fr;gap:28px;align-items:start}
.list{display:flex;flex-direction:column;background:var(--panel);border:1px solid var(--line);border-radius:var(--r)}
.list:empty{display:none}
.item{padding:13px 16px;cursor:pointer;border-bottom:1px solid var(--line);border-left:3px solid transparent}
.item:last-child{border-bottom:0}
.item:hover{background:#faf9f6}
.item.on{border-left-color:var(--green);background:#f7f8f6}
.item .t{font-weight:500;font-size:14.5px}
.item .m{color:var(--mute);font-size:13px;margin-top:3px;display:flex;justify-content:space-between;gap:10px}
.panel .list{border:0;border-radius:0}
.panel .item{padding-left:0;padding-right:0;border-left:0}
.panel .item.on{background:none}
.ladder{display:grid;gap:16px}
.role{border:1px solid var(--line);border-radius:var(--r);background:var(--panel);overflow:hidden}
.role header{display:flex;justify-content:space-between;align-items:center;padding:10px 16px;border-bottom:1px solid var(--line);font-weight:500}
.role header .pct{font-weight:400;color:var(--mute);font-size:13px}
.step{display:flex;align-items:center;gap:12px;padding:9px 16px;border-top:1px solid var(--line);cursor:pointer;user-select:none}
.role .step:first-of-type{border-top:0}
.step:hover{background:#faf9f6}
.box{width:17px;height:17px;border:1.5px solid var(--line-strong);border-radius:3px;flex:none;display:grid;place-items:center;font-size:11px;color:#fff}
.step.done .box{background:var(--green);border-color:var(--green)}
.step.done .box::after{content:"\2713"}
.step.done .lbl{color:var(--mute)}
.step .lbl{flex:1}
.step .by{font-size:12.5px;color:var(--mute)}
.bar{height:3px;background:var(--line);margin:8px 0 4px}
.bar i{display:block;height:100%;background:var(--green)}
.form{display:grid;gap:16px;max-width:680px}
.form .row2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
label{display:grid;gap:6px;font-size:13px;color:var(--ink-2)}
input,select,textarea{border:1px solid var(--line-strong);border-radius:var(--r);padding:9px 11px;background:#fff;color:var(--ink);font-size:14.5px}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--green);outline-offset:1px}
textarea{min-height:96px;resize:vertical}
.check{display:flex;align-items:center;gap:8px;color:var(--ink)}
.check input{width:16px;height:16px}
.actions{display:flex;gap:10px;margin-top:6px}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:9px 16px;border-radius:var(--r);font-size:13.5px;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.show{opacity:1}
.timeline{display:grid}
.tl{display:grid;grid-template-columns:18px 1fr;gap:10px;padding:7px 0;font-size:14px}
.tl .dot{width:8px;height:8px;border-radius:50%;background:var(--line-strong);margin:8px auto 0}
.tl.done .dot{background:var(--green)}
.kv{display:grid;grid-template-columns:160px 1fr;gap:8px 16px;font-size:14.5px}
.kv div:nth-child(odd){color:var(--mute)}
.note{border-left:3px solid #b9674f;padding:8px 14px;font-size:14px;color:var(--ink-2);background:var(--clay-tint)}
.empty{color:var(--mute);padding:22px;text-align:center;font-size:14px}
.sr{position:absolute;left:-9999px}
@media (max-width:980px){.app{grid-template-columns:1fr}.rail{position:static;height:auto;flex-direction:row;flex-wrap:wrap}.rail .spacer,.rail .who{display:none}.main{padding:0 18px 40px}.split,.grid.c3,.grid.c2,.form .row2{grid-template-columns:1fr}.grid.c4{grid-template-columns:1fr 1fr}}
@media (prefers-reduced-motion:reduce){.toast{transition:none}}
.signin{position:fixed;inset:0;background:var(--bg);display:grid;place-items:center;z-index:10}
.signin .card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:40px 44px;width:440px;max-width:92vw;text-align:center}
.signin .co{font-family:"Cormorant Garamond",Georgia,serif;font-size:30px;font-weight:600;line-height:1.1}
.signin .sub{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--mute);margin:10px 0 28px}
.msbtn{display:flex;align-items:center;justify-content:center;gap:12px;width:100%;border:1px solid var(--line-strong);background:#fff;border-radius:var(--r);padding:11px;cursor:pointer;font-weight:500;font-size:15px}
.msbtn:hover{background:#f6f6f3}
.ms{display:grid;grid-template-columns:1fr 1fr;gap:2px;width:16px;height:16px}
.ms i{display:block}
.signin .alt{margin-top:18px;font-size:13px;color:var(--mute)}
.signin .alt button{background:none;border:0;color:var(--green);cursor:pointer;text-decoration:underline;padding:0 4px;font-size:13px}
.age{font-size:12px;color:var(--mute)}
.age.late{color:#b9674f;font-weight:500}
.amount{text-align:right;font-variant-numeric:tabular-nums}
.total{display:flex;justify-content:space-between;padding:12px 0 0;border-top:1px solid var(--line);font-weight:600;margin-top:4px}
.tog{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.tog:last-child{border-bottom:0}
.tiles{display:grid;grid-template-columns:repeat(11,1fr);gap:18px 12px;margin-bottom:30px;align-items:start}
.app-icon{width:64px;height:64px;border-radius:16px;margin:0 auto 8px;display:grid;place-items:center;font-family:"Cormorant Garamond",Georgia,serif;font-weight:600;font-size:28px;color:#fff;overflow:hidden;box-shadow:inset 0 0 0 1px rgba(0,0,0,.06)}
.app-icon img{width:70%;height:70%;object-fit:contain}
.tile.wide{grid-column:span 4}
.tile.wide .app-icon{width:100%;max-width:340px;height:64px;border-radius:16px;background:#fff;box-shadow:inset 0 0 0 1px var(--line)}
.tile.wide .app-icon img{width:92%;height:70%;object-fit:contain}
.tile{display:block;text-align:center;text-decoration:none;color:var(--ink);padding:6px 2px;border-radius:var(--r)}
.tile:hover .app-icon{transform:translateY(-2px)}
.tile .n{font-weight:500;font-size:13.5px;line-height:1.2}
.tile .d{display:none}
.tile .o{display:none}
@media (max-width:980px){.tiles{grid-template-columns:repeat(4,1fr)}.tile.wide{grid-column:span 4}}
@media (prefers-reduced-motion:no-preference){.app-icon{transition:transform .15s}}
.shop{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-bottom:28px}
.prod{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;display:flex;flex-direction:column}
.prod .img{position:relative;width:100%;padding-top:100%;background:#efeee9;border-bottom:1px solid var(--line)}
.prod .img svg{position:absolute;left:19%;top:19%;width:62%;height:62%}
.prod .img img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.prod .body{padding:14px 16px 16px;display:grid;gap:8px}
.prod .t{font-weight:500;font-size:15px}
.prod .d{color:var(--mute);font-size:13px;min-height:38px}
.prod .ctl{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:4px}
.prod select{padding:6px 8px;font-size:13.5px}
.cartitem{padding:12px 0;border-bottom:1px solid var(--line);display:grid;gap:8px}
.cartitem:last-child{border-bottom:0}
.cartitem .h{display:flex;justify-content:space-between;align-items:center}
.cartitem input[type=file]{font-size:12.5px;padding:6px}
.cartitem textarea{min-height:60px;font-size:13.5px}
.files{font-size:12.5px;color:var(--green)}
@media (max-width:980px){.shop{grid-template-columns:1fr 1fr}}
.asset{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.asset .img{position:relative;width:100%;padding-top:66%;background:#e9e8e2;border-bottom:1px solid var(--line)}
.asset .img svg{position:absolute;left:0;top:0;width:100%;height:100%}
.asset .body{padding:12px 14px}
.asset .t{font-weight:500;font-size:14.5px}
.asset .d{color:var(--mute);font-size:12.5px;margin-top:2px}
.asset .a{margin-top:8px;display:flex;gap:10px;font-size:13px}
.asset .a a{color:var(--green)}
.okmark{display:inline-block;font-size:11.5px;color:var(--green-ink);background:var(--green-tint);padding:2px 8px;border-radius:999px;margin-top:8px}
.hero{background:#121a16;color:#e9efec;border-radius:var(--r);padding:36px 40px;display:grid;grid-template-columns:1.4fr 1fr;gap:32px;margin-bottom:26px}
.hero h2{color:#fff;font-size:34px;margin-bottom:10px}
.hero p{color:#c3cbc6;font-size:15.5px;max-width:52ch}
.hero .price{font-size:40px;font-weight:500;letter-spacing:-.02em;color:#fff;line-height:1}
.hero .price small{display:block;font-family:"Inter",sans-serif;font-size:13px;color:#9aa59f;margin-top:6px}
.hero .side{border-left:1px solid rgba(255,255,255,.12);padding-left:32px;display:grid;align-content:space-between;gap:18px}
.hero .btn{background:#fff;color:#121a16;border-color:#fff;justify-self:start}
.hero .btn:hover{background:#e9efec}
.cover{display:grid;grid-template-columns:1fr 1fr;gap:22px;margin-bottom:26px}
.cover .panel h3{border:0;padding:0;margin-bottom:6px}
.cover .lead{color:var(--mute);font-size:13.5px;margin-bottom:12px}
.cover ul{list-style:none;margin:0;padding:0}
.cover li{padding:8px 0;border-top:1px solid var(--line);font-size:14.5px}
.journey{display:grid;grid-template-columns:28px 1fr;gap:0 16px}
.journey .j{display:contents}
.journey .dot{width:12px;height:12px;border-radius:50%;background:var(--line-strong);margin:6px auto 0;position:relative}
.journey .line{width:2px;background:var(--line);margin:0 auto;min-height:26px}
.journey .j.done .dot{background:var(--green)}
.journey .j.now .dot{background:var(--amber);box-shadow:0 0 0 5px var(--amber-tint)}
.journey .t{font-weight:500;font-size:15px}
.journey .j.todo .t{color:var(--mute);font-weight:400}
.journey .d{color:var(--mute);font-size:13.5px;margin-bottom:14px}
.journey .j.now .d{color:var(--ink-2)}
.filecard{display:grid;grid-template-columns:1fr 1fr;gap:22px;align-items:start}
.quiet-kv{display:grid;grid-template-columns:150px 1fr;gap:8px 14px;font-size:14.5px}
.quiet-kv div:nth-child(odd){color:var(--mute)}
@media (max-width:980px){.hero,.cover,.filecard{grid-template-columns:1fr}.hero .side{border-left:0;padding-left:0;border-top:1px solid rgba(255,255,255,.12);padding-top:20px}}
</style>
</head>

<div class="signin" id="signin">
  <div class="card">
    <div class="co">The Litchfield Company</div>

function ladder(a){

      ${f.county==="Georgetown"?`<p class="muted small" style="margin-top:10px">Georgetown County: the attorney's office does not order the CL-100, so the admin team orders it after due diligence. The agent still gives the client three or more pest companies to choose from.</p>`:f.county==="Horry"?`<p class="muted small" style="margin-top:10px">Horry County: the attorney's office orders the CL-100.</p>`:""}

function orderFrom(id,what){ const f=S.files.find(x=>x.id===id); if(what==="CL-100"&&f.cl100.startsWith("Not chosen")){toast("The contract names no CL-100 company. Amend the contract or sign the waiver first."); return;} f.log=f.log||[]; f.log.push("Nov 4: "+(what==="CL-100"?"CL-100 ordered from "+f.cl100.split(" (")[0]+" for after due diligence ("+f.dd+")":"Inspection request sent to the agent's chosen inspector; showing instructions attached")); f.steps[5][1]=true; render(); toast(what==="CL-100"?"CL-100 ordered.":"Inspection requested."); }

function addFile(e,staff){ e.preventDefault(); const f=new FormData(e.target); const id="C-2026-0"+(20+S.files.length-3); const steps=mk(0); S.files.unshift({id,agent:staff?f.get("agent"):me().name,prop:f.get("prop"),side:f.get("side"),county:f.get("county"),dd:f.get("dd")||"",close:f.get("close")||"",cl100:f.get("cl100")||"Not chosen in the contract",need:f.get("need")||"",fee:["Orangeburg","Clarendon"].includes(f.get("county"))?"Not charged (inland office)":"$125, billed with the admin fee on the closing statement",status:"todo",steps,flag:f.get("cl100")?"":"Termite box not checked in the contract. Waiver needs to be signed and added, or the contract amended, before this file moves."}); toast(staff?"File "+id+" opened.":"Request sent. The admin team will open the file and text you."); go(staff?"concierge":"myconcierge",{file:id}); return false; }

    <div class="panel"><h3>My requests</h3>${reqs.length?reqs.map(x=>`<div class="item ${r&&x.id===r.id?"on":""}" onclick="go('home',{req:${x.id}})"><div class="t">#${x.id} ${x.text}</div><div class="m"><span>${x.owner?"With "+x.owner:"Not picked up yet"}</span>${chip(x.status)}</div></div>`).join(""):`<div class="empty">Nothing open. Ask for help any time.</div>`}
      ${r?`<div style="margin-top:14px"><h3>Updates on #${r.id}</h3><p class="muted small">Only the updates the team sends you show here.</p>${r.status!=="done"?`<div class="actions" style="margin:8px 0 10px"><button class="btn quiet small" onclick="callMe(${r.id})">Call me about this</button></div>`:""}<div class="timeline">${r.updates.map(u=>`<div class="tl done"><div class="dot"></div><div>${u}</div></div>`).join("")}</div></div>`:""}</div>
    <div><div class="panel"><h3>My concierge files</h3>${files.length?files.map(f=>`<div class="item" onclick="go('myconcierge',{file:'${f.id}'})"><div class="t">${f.prop}</div><div class="m"><span>Closes ${f.close}</span>${chip(f.status)}</div></div>`).join(""):`<div class="empty">No files. Request the service on your next contract.</div>`}</div><div class="panel" style="margin-top:18px"><h3>My print orders</h3>${S.orders.filter(o=>o.agent===m.name).map(o=>`<div class="item" onclick="go('print',{order:''})"><div class="t">${o.items.map(i=>i[0]).join(", ")}</div><div class="m"><span>${o.updates[o.updates.length-1].replace(/^[A-Z][a-z]{2} \d+: /,"")}</span>${chip(o.status)}</div></div>`).join("")||`<div class="empty">No orders yet.</div>`}</div></div>
  </div>`;
};
PAGES.docs = () => `<div class="pagehead"><div><h1>Documents</h1><p>Your transaction files from SkySlope and every company form, in one place. You signed in once with your Microsoft account, so there is nothing else to log in to.</p></div></div>
  <div class="grid c2">
    <div class="panel"><h3>My transaction files <span class="muted small">from SkySlope, updated nightly</span></h3>
      ${SKY.map(t=>`<div class="item" style="cursor:default"><div class="t">${t.prop}</div><div class="muted small">${t.type}. Updated ${t.updated}.</div><div class="small" style="margin-top:6px">${t.docs.map(d=>`<a href="#" onclick="toast('Opening ${d} (demo)');return false">${d}</a>`).join(" &middot; ")}</div></div>`).join("")}
      <p class="muted small" style="margin-top:10px">Need to add or sign something? That still happens in SkySlope. <a href="#" onclick="toast('Opens SkySlope with your Microsoft sign-in (demo)');return false">Open SkySlope</a></p></div>
    <div class="panel"><h3>Company forms and references</h3>
      ${FORMS.map(([n,d])=>`<div class="item" style="cursor:default"><div class="t"><a href="#" onclick="toast('Opening ${n} (demo)');return false">${n}</a></div><div class="muted small">${d}</div></div>`).join("")}</div>
  </div>`;
PAGES.content = () => `<div class="pagehead"><div><h1>Company content</h1><p>Logos, photos, templates, and copy the company owns. Everything here is cleared for your marketing, so there is nothing to license and nothing to worry about. Use it as is.</p></div></div>
  ${CONTENT.map(sec=>`<h3 style="margin:6px 0 12px">${sec.g}</h3><div class="shop" style="grid-template-columns:repeat(4,1fr)">${sec.items.map(it=>`<div class="asset"><div class="img">${CART_ART[it[2]]}</div><div class="body"><div class="t">${it[0]}</div><div class="d">${it[1]}</div><div class="a"><a href="#" onclick="toast('${it[0]} downloaded (demo)');return false">Download</a>${sec.g==="Templates"?`<a href="#" onclick="toast('Opens in the editor with your name filled in (demo)');return false">Customize</a>`:""}</div><span class="okmark">Company owned, cleared for use</span></div></div>`).join("")}</div>`).join("")}`;
PAGES.library = () => `<div class="pagehead"><div><h1>Content library</h1><p>What agents see under Company content. Add a file here and it is live for everyone; retire it and it comes down everywhere.</p></div><button class="btn" onclick="toast('Upload opens (demo)')">Add content</button></div>
  <div class="panel" style="padding:0"><table><thead><tr><th>Item</th><th>Group</th><th>Formats</th><th>Rights</th><th></th></tr></thead><tbody>${CONTENT.flatMap(sec=>sec.items.map(it=>`<tr><td>${it[0]}</td><td>${sec.g}</td><td class="muted small">${it[1]}</td><td><span class="chip done">Company owned</span></td><td><button class="btn quiet small" onclick="toast('Replaced (demo)')">Replace</button></td></tr>`)).join("")}</tbody></table></div>
  <p class="muted small" style="margin-top:12px">Anything marketing puts here should be company owned or licensed to the company for agent use. That is what makes it safe for agents to grab without asking.</p>`;
PAGES.dues = () => {
  const total=DUES.lines.reduce((a,l)=>a+l[2],0);
  return `<div class="pagehead"><div><h1>Dues and fees</h1><p>What you owe the brokerage and what makes up this month. Pulled from Broker Wolf, the same numbers accounting sees.</p></div><button class="btn quiet" onclick="toast('Statement PDF downloaded (demo)')">Download statement</button></div>
  <div class="grid c4" style="margin-bottom:24px">
    <div class="stat"><div class="k">$${DUES.balance.toFixed(2)}</div><div class="l">balance owed</div></div>
    <div class="stat"><div class="k">${DUES.nextDraft.replace(", 2026","")}</div><div class="l">next draft date</div></div>
    <div class="stat"><div class="k">$${total.toFixed(2)}</div><div class="l">${DUES.month} charges</div></div>
    <div class="stat"><div class="k">${DUES.history.length}</div><div class="l">statements on file</div></div>
  </div>
  <div class="grid c2">
    <div class="panel"><h3>${DUES.month}</h3><table><tbody>${DUES.lines.map(l=>`<tr><td class="muted small" style="width:60px">${l[0]}</td><td>${l[1]}</td><td class="amount">$${l[2].toFixed(2)}</td></tr>`).join("")}</tbody></table><div class="total"><span>Total this month</span><span>$${total.toFixed(2)}</span></div>
      <div class="actions" style="margin-top:14px"><button class="btn quiet small" onclick="askCharge()">Ask about a charge</button></div></div>
    <div class="panel"><h3>Past statements</h3><table><tbody>${DUES.history.map(h=>`<tr><td>${h[0]}</td><td class="amount">$${h[1].toFixed(2)}</td><td class="muted small">${h[2]}</td></tr>`).join("")}</tbody></table><p class="muted small" style="margin-top:12px">Dues draft on the 15th. Print orders and other charges from the portal show here the day they are placed.</p></div>
  </div>`;
};
function askCharge(){ const id=Math.max(...S.requests.map(r=>r.id))+1; S.requests.unshift({id,agent:me().name,cat:"Pay or commission",dept:"Accounting",text:"Question about a charge on my "+DUES.month+" statement.",status:"doing",owner:"Sue",opened:"Nov 4",updates:["Nov 4: We have your question. Sue in Accounting has it."],notes:["Nov 4: Opened from Dues and fees. Routed to Accounting, Sue."]}); toast("Request #"+id+" sent to Sue in Accounting."); go("home",{req:id}); }
PAGES.numbers = () => `<div class="pagehead"><div><h1>My numbers</h1><p>Your production as of the ${NUMBERS.asOf}. Same figures as the company reports, so there is nothing to reconcile.</p></div></div>
  <div class="grid c4" style="margin-bottom:24px">
    <div class="stat"><div class="k">${NUMBERS.ytd.closed}</div><div class="l">closed this year</div></div>
    <div class="stat"><div class="k">${NUMBERS.ytd.volume}</div><div class="l">closed volume, year to date</div></div>
    <div class="stat"><div class="k">${NUMBERS.ytd.pending}</div><div class="l">pending, ${NUMBERS.ytd.pendingVolume}</div></div>
    <div class="stat"><div class="k">${NUMBERS.ytd.active}</div><div class="l">active listings</div></div>
  </div>
  <div class="panel"><h3>This month</h3><div class="kv"><div>Closed</div><div>${NUMBERS.month.closed}, ${NUMBERS.month.volume}</div><div>Pending</div><div>${S.files.filter(f=>f.agent===me().name&&f.status!=="done").length} with the concierge service</div></div><p class="muted small" style="margin-top:12px">Updated when the weekly inventory and sales reports are pulled. See something off? <a href="#" onclick="go('help');return false">Send a request</a> and it goes to Accounting.</p></div>`;
PAGES.directory = () => `<div class="pagehead"><div><h1>Who to call</h1><p>Who handles what, so you know where a request lands. Anything you send through Request help routes to these same people.</p></div></div>
  <div class="panel" style="padding:0"><table><thead><tr><th>Department</th><th>Person</th><th>Handles</th><th>Reach</th></tr></thead><tbody>${DIRECTORY.map(d=>`<tr><td>${d[0]}</td><td>${d[1]}</td><td>${d[2]}</td><td>${d[3]||"Through Request help"}</td></tr>`).join("")}</tbody></table></div>`;
PAGES.profile = () => `<div class="pagehead"><div><h1>My profile</h1><p>What the company has on file for you. Ask for a change and it goes to the right person.</p></div></div>${record(me(),false)}
  <div class="panel" style="margin-top:18px"><h3>How to reach me</h3>
    <div class="tog"><span>Text me when a request or order has an update</span><input type="checkbox" ${S.prefs.text?"checked":""} onchange="S.prefs.text=this.checked;toast('Saved.')"></div>
    <div class="tog"><span>Email me a copy of each update</span><input type="checkbox" ${S.prefs.email?"checked":""} onchange="S.prefs.email=this.checked;toast('Saved.')"></div>
    <div class="tog"><span>Send me a Friday summary of my open items</span><input type="checkbox" ${S.prefs.digest?"checked":""} onchange="S.prefs.digest=this.checked;toast('Saved.')"></div>
    <p class="muted small" style="margin-top:10px">Texts go to ${me().phone}. Signing in uses your Microsoft work account, so your password is the same one as company email.</p></div>`;
PAGES.help = () => `<div class="pagehead"><div><h1>Request help</h1><p>Say what you need. It gets a number, someone picks it up, and you can watch it move from Home.</p></div></div>${requestForm(false)}`;
PAGES.myconcierge = () => {
  const mine=S.files.filter(f=>f.agent===me().name); const f=mine.find(x=>x.id===S.sel.file)||mine[0];
  if(S.sel.file==="new") return `<div class="pagehead"><div><h1>Request the concierge service</h1><p>For one listing or contract. Upload the signed paperwork and your coordinator takes the file from there. Your paperwork has to be in SkySlope before review can start.</p></div></div>${fileForm(false)}`;
  return `<div class="hero">
    <div><h2>Concierge</h2><p>Hand us the file and keep selling. A compliance coordinator takes your listing or contract from SkySlope to closing, keeps it clean, checks the closing statement, and makes sure you get paid on time.</p>
      <div class="price" style="margin-top:22px">$125<small>per listing, on the closing statement with your admin fee. Orangeburg and Manning agents are not charged.</small></div></div>
    <div class="side"><div><div style="font-size:13px;color:#9aa59f;margin-bottom:6px">How it works</div><div style="font-size:15px;line-height:1.6">Request it on a file. Your coordinator reviews the paperwork, tells you what is missing, and carries it through closing. You get a text at each step.</div></div><button class="btn" onclick="go('myconcierge',{file:'new'})">Request concierge on a file</button></div>
  </div>
  <div class="cover">
    <div class="panel"><h3>We take care of</h3><p class="lead">The paperwork side of the file, start to finish.</p><ul>${["Reviewing your SkySlope file and keeping every item green through closing","Chasing missing pages, signatures, and dates with you until they are fixed","Tracking the CL-100 need date and ordering it after due diligence (Georgetown County)","Checking the closing statement line by line: commission, admin fee, CL-100, home warranty","Closing the file in SkySlope and Broker Wolf and issuing your EFT"].map(t=>`<li>${t}</li>`).join("")}</ul></div>
    <div class="panel"><h3>You keep</h3><p class="lead">The parts only you can do.</p><ul>${["Entering and updating the MLS, and closing it out","Ordering home inspections and the home warranty","Giving your client three or more pest companies to choose from","Sending the closing packet to the attorney, with us copied","Your clients, and every signature"].map(t=>`<li>${t}</li>`).join("")}</ul></div>
  </div>
  ${mine.length?`<h3 style="margin:8px 0 12px">Your files</h3><div class="filecard"><div class="list">${mine.map(x=>`<div class="item ${x.id===f.id?"on":""}" onclick="go('myconcierge',{file:'${x.id}'})"><div class="t">${x.prop}</div><div class="m"><span>${x.side} side, closes ${x.close}</span>${chip(x.status)}</div></div>`).join("")}</div>${agentFile(f)}</div>`:`<div class="empty">You have no concierge files yet. Request it on your next listing or contract.</div>`}`;
};
function agentFile(f){
  const done=f.steps.filter(s=>s[1]).length; const now=Math.min(done,STAGES.length-1);
  return `<div class="panel"><div class="pagehead" style="margin-bottom:12px"><div><h2 style="font-size:26px">${f.prop}</h2><p class="small">${f.side} side. Closes ${f.close}.</p></div>${chip(f.status)}</div>
    <div class="quiet-kv" style="margin-bottom:16px"><div>Due diligence ends</div><div>${f.dd}</div><div>CL-100</div><div>${f.cl100}${f.need?", needed "+f.need:""}</div><div>Concierge fee</div><div>${f.fee||""}</div></div>
    ${f.flag?`<div class="note" style="margin-bottom:16px">${f.flag}</div>`:""}
    <div class="journey">${STAGES.map((st,i)=>{const cls=i<done?"done":(i===done&&f.status!=="done"?"now":"todo");return `<div class="j ${cls}"><div><div class="dot"></div>${i<STAGES.length-1?`<div class="line"></div>`:""}</div><div><div class="t">${st[0]}</div><div class="d">${cls==="todo"?"":st[1]}</div></div></div>`}).join("")}</div>
    <div class="actions" style="margin-top:6px"><button class="btn quiet small" onclick="toast('Message sent to your coordinator. You will get a text back.')">Message my coordinator</button>${f.status!=="done"?`<button class="btn quiet small" onclick="toast('Call requested. Your coordinator will call '+me().phone+'.')">Call me about this file</button>`:""}</div>
  </div>`;
}

render();
</script>
</body>
</html>
